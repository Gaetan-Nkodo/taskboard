version: "3.9"

services:
  seq:
    image: datalust/seq:latest
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskboard-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Your_password123
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "sqlcmd -S localhost -U sa -P Your_password123 -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: src/TaskBoard.Api/Dockerfile
    container_name: taskboard-api
    depends_on:
      - db
      - seq
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=TaskBoard;User Id=sa;Password=Your_password123;TrustServerCertificate=True;
      - Jwt__Key=SuperSecretKeyForJwt123!
    ports:
      - "8080:8080"
volumes:
  seq-data:
